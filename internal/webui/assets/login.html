<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 · Sub-Panel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login-card" aria-labelledby="loginTitle">
    <div class="brand-row"><div class="logo" aria-hidden="true">S</div><strong>Sub-Panel</strong></div>
    <h1 id="loginTitle">登录管理控制台</h1>
    <p class="sub">管理订阅网关、访问规则和上游接入。</p>
    <form id="loginForm">
      <label for="loginUsername">管理员账号</label>
      <input id="loginUsername" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label for="loginPassword">密码</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      <button id="loginSubmit" class="primary" type="submit">登录</button>
      <p id="loginError" class="err" role="alert"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#loginForm');
    const btn = document.querySelector('#loginSubmit');
    const error = document.querySelector('#loginError');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (btn.disabled) return;
      const data = Object.fromEntries(new FormData(form));
      btn.disabled = true;
      btn.textContent = '正在登录…';
      error.textContent = '';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data),
        });
        if (response.ok) { location.replace('/'); return; }
        error.textContent = response.status === 401 ? '账号或密码不正确。' : '暂时无法登录，请稍后重试。';
      } catch {
        error.textContent = '无法连接服务器，请检查网络后重试。';
      }
      btn.disabled = false;
      btn.textContent = '登录';
    });
  </script>
</body>
</html>
